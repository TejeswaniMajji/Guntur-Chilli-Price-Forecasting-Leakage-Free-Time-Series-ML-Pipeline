[tool.poetry]
name = "chilli-price-prediction"
version = "2.0.0"
description = "Walk-forward validated multi-horizon price forecasting for Guntur LCA-334 chilli, with a Streamlit dashboard and a FastAPI prediction service."
authors = ["Pavan_vs"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.11"
numpy = ">=1.26,<2.4"
pandas = ">=2.2,<2.4"
scikit-learn = ">=1.3,<1.8"
scipy = ">=1.11,<1.17"
matplotlib = ">=3.8,<3.11"
seaborn = ">=0.13,<0.14"
streamlit = ">=1.36,<1.49"
fastapi = ">=0.110,<0.120"
uvicorn = ">=0.29,<0.35"
joblib = ">=1.3,<2.0"
openpyxl = ">=3.1,<4.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0,<9.0"
black = ">=24.0,<25.0"
flake8 = ">=6.0,<7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 110
